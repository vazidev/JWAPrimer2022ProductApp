# Dev profile: enable SQL-based seeding
# Change platform to 'h2' if using H2 locally
spring.sql.init.mode=always
spring.sql.init.platform=mysql

# Optional: keep schema up to date in dev
# spring.jpa.hibernate.ddl-auto=update

# H2 console (enabled in dev). Available at http://localhost:9090/app/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# To use H2 in dev instead of MySQL, uncomment and adjust:
# spring.datasource.url=jdbc:h2:file:./h2DataBase/revaturejwadb
# spring.datasource.driver-class-name=org.h2.Driver
# spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
